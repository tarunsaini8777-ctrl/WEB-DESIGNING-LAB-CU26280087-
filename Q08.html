<!-- Q8: Create a glossary page for computer science terms using a description list (<dl>), description terms (<dt>), and description definitions (<dd>). -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Computer Science Glossary</title></head>
<body>
    <h1>Computer Science Glossary</h1>
    <dl>
        <dt>CPU</dt><dd>Central Processing Unit; executes instructions.</dd>
        <dt>RAM</dt><dd>Temporary memory used by a computer.</dd>
        <dt>HTML</dt><dd>Markup language used to structure webpages.</dd>
    </dl>
</body>
</html>
