<!-- Q18: Create a timetable grid where at least one cell spans across multiple columns using the colspan attribute. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Timetable</title></head>
<body>
    <table border="1">
        <tr><th>Day</th><th>9-10 AM</th><th>10-11 AM</th></tr>
        <tr><td>Monday</td><td>HTML</td><td>CSS</td></tr>
        <tr><td colspan="3">Lunch Break</td></tr>
        <tr><td>Tuesday</td><td>Linux</td><td>Database</td></tr>
    </table>
</body>
</html>
