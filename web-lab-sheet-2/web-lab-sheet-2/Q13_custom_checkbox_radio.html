<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q13. Implement custom styled checkboxes and radio buttons using CSS pseudo-elements
     (::before and ::after) and sibling selectors (~).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q13 - Custom Checkboxes and Radios</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    form { max-width: 460px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .opt { position: relative; display: block; padding-left: 36px; margin: 12px 0; cursor: pointer; user-select: none; }
    .opt input { position: absolute; opacity: 0; cursor: pointer; }            /* hide the native control */

    /* ::before draws the box / circle */
    .opt .mark { position: absolute; left: 0; top: 0; width: 24px; height: 24px; background: #e5e7eb; border: 2px solid #9ca3af; transition: .2s; }
    .checkbox .mark { border-radius: 5px; }
    .radio .mark    { border-radius: 50%; }
    .opt:hover input ~ .mark { background: #d1d5db; }                             /* ~ general sibling selector */
    .opt input:checked ~ .mark { background: #2563eb; border-color: #2563eb; }

    /* ::after draws the tick / dot, shown only when checked */
    .opt .mark::after { content: ""; position: absolute; display: none; }
    .opt input:checked ~ .mark::after { display: block; }
    .checkbox .mark::after { left: 7px; top: 2px; width: 6px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
    .radio .mark::after { left: 5px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
    .opt input:focus-visible ~ .mark { outline: 3px solid rgba(37,99,235,.4); }   /* keyboard focus ring */
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Preferences</h1>
    <h3>Interests</h3>
    <label class="opt checkbox"><input type="checkbox" name="i" value="web"><span class="mark"></span> Web development</label>
    <label class="opt checkbox"><input type="checkbox" name="i" value="ai"><span class="mark"></span> Artificial intelligence</label>
    <label class="opt checkbox"><input type="checkbox" name="i" value="db"><span class="mark"></span> Databases</label>
    <h3>Mode of study</h3>
    <label class="opt radio"><input type="radio" name="m" value="on" checked><span class="mark"></span> Online</label>
    <label class="opt radio"><input type="radio" name="m" value="off"><span class="mark"></span> Offline</label>
  </form>
  
</body>
</html>
