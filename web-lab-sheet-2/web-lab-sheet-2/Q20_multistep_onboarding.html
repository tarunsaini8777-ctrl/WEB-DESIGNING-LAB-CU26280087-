<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q20. Build a multi-step user onboarding form layout using CSS display properties
     (display: none / block) to simulate step progression.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q20 - Multi-step Onboarding Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    .wizard { max-width: 520px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .progress { display: flex; margin-bottom: 24px; }
    .progress .dot { flex: 1; text-align: center; padding-bottom: 8px; border-bottom: 4px solid #e5e7eb; color: #9ca3af; font-size: .85rem; font-weight: 600; }
    .progress .dot.done, .progress .dot.current { border-color: #2563eb; color: #2563eb; }

    .step { display: none; }                  /* every step hidden by default */
    .step.active { display: block; }          /* only the active step is shown */

    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    .actions { display: flex; justify-content: space-between; margin-top: 24px; }
    button { padding: 10px 24px; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .back { background: #e5e7eb; } .next, .submit { background: #2563eb; color: #fff; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <form class="wizard" id="wizard" action="#" method="post" novalidate>
    <h1>Welcome aboard</h1>
    <div class="progress" id="progress">
      <div class="dot">1. Account</div><div class="dot">2. Profile</div><div class="dot">3. Preferences</div>
    </div>

    <div class="step active">
      <h2>Create account</h2>
      <label for="email">Email</label><input type="email" id="email" required>
      <label for="pw">Password</label><input type="password" id="pw" required minlength="6">
    </div>

    <div class="step">
      <h2>Your profile</h2>
      <label for="name">Full name</label><input type="text" id="name" required>
      <label for="city">City</label><input type="text" id="city" required>
    </div>

    <div class="step">
      <h2>Preferences</h2>
      <label for="lang">Preferred language</label>
      <select id="lang"><option>English</option><option>Hindi</option></select>
      <label><input type="checkbox" id="news"> Send me the newsletter</label>
    </div>

    <div class="actions">
      <button type="button" class="back" id="back" hidden>&larr; Back</button>
      <button type="button" class="next" id="next">Next &rarr;</button>
      <button type="submit" class="submit" id="submit" hidden>Finish</button>
    </div>
  </form>
  <script>
    const steps = document.querySelectorAll('.step');
    const dots  = document.querySelectorAll('.progress .dot');
    const back = document.getElementById('back'), next = document.getElementById('next'), submit = document.getElementById('submit');
    let current = 0;

    function show(i) {
      steps.forEach((s, k) => s.classList.toggle('active', k === i));    // display:block only for the current step
      dots.forEach((d, k) => { d.classList.toggle('current', k === i); d.classList.toggle('done', k < i); });
      back.hidden = (i === 0);
      next.hidden = (i === steps.length - 1);
      submit.hidden = (i !== steps.length - 1);
    }
    next.addEventListener('click', () => {
      const fields = steps[current].querySelectorAll('input, select');
      for (const f of fields) { if (!f.checkValidity()) { f.reportValidity(); return; } }   // validate the step first
      current++; show(current);
    });
    back.addEventListener('click', () => { current--; show(current); });
    document.getElementById('wizard').addEventListener('submit', e => { e.preventDefault(); alert('Onboarding complete!'); });
    show(0);
  </script>
</body>
</html>
