<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q10. Design a CSS-styled data entry table embedded inside a form container with
     alternating row colors and hover effects.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q10 - Data Entry Table in a Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    .form-container { max-width: 760px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
    th { background: #1e40af; color: #fff; text-align: left; padding: 10px; }
    td { padding: 8px 10px; }
    tbody tr:nth-child(even) { background: #eff6ff; }            /* alternating rows */
    tbody tr:nth-child(odd)  { background: #ffffff; }
    tbody tr { transition: background .2s; }
    tbody tr:hover { background: #fde68a; }                      /* hover effect */
    td input { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; background: transparent; }
    td input:focus { outline: none; border-color: #1e40af; background: #fff; }
    button { padding: 10px 24px; background: #1e40af; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Marks Entry</h1>
    <form action="#" method="post">
      <table>
        <thead><tr><th>#</th><th>Student name</th><th>Roll no.</th><th>Marks</th></tr></thead>
        <tbody>
          <tr><td>1</td><td><input type="text" name="n1" aria-label="Name 1"></td><td><input type="text" name="r1" aria-label="Roll 1"></td><td><input type="number" name="m1" min="0" max="100" aria-label="Marks 1"></td></tr>
          <tr><td>2</td><td><input type="text" name="n2" aria-label="Name 2"></td><td><input type="text" name="r2" aria-label="Roll 2"></td><td><input type="number" name="m2" min="0" max="100" aria-label="Marks 2"></td></tr>
          <tr><td>3</td><td><input type="text" name="n3" aria-label="Name 3"></td><td><input type="text" name="r3" aria-label="Roll 3"></td><td><input type="number" name="m3" min="0" max="100" aria-label="Marks 3"></td></tr>
          <tr><td>4</td><td><input type="text" name="n4" aria-label="Name 4"></td><td><input type="text" name="r4" aria-label="Roll 4"></td><td><input type="number" name="m4" min="0" max="100" aria-label="Marks 4"></td></tr>
          <tr><td>5</td><td><input type="text" name="n5" aria-label="Name 5"></td><td><input type="text" name="r5" aria-label="Roll 5"></td><td><input type="number" name="m5" min="0" max="100" aria-label="Marks 5"></td></tr>
        </tbody>
      </table>
      <button type="submit">Save</button>
    </form>
  </div>
  
</body>
</html>
