<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q15. Build a search input box that expands in width smoothly using CSS transition when
     focused.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q15 - Expanding Search Box</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .search { position: relative; }
    .search input {
      width: 180px; padding: 12px 18px 12px 44px; border: 2px solid #334155; border-radius: 30px;
      background: #1e293b; color: #f1f5f9; font-size: 1rem; outline: none;
      transition: width .5s ease, border-color .3s, box-shadow .3s;               /* smooth expansion */
    }
    .search input::placeholder { color: #94a3b8; }
    .search input:focus { width: 420px; border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,.2); }
    .search .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }
    @media (max-width: 520px) { .search input:focus { width: 270px; } }
  </style>
</head>
<body>
  <form class="search" role="search" action="#">
    <span class="icon" aria-hidden="true">&#128269;</span>
    <input type="search" name="q" placeholder="Search..." aria-label="Search">
  </form>
  
</body>
</html>
