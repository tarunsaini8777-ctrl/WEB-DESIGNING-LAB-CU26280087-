<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q18. Design a responsive contact us page featuring an embedded form on one side and
     company location details on the other using CSS Flexbox.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q18 - Contact Us Page (Flexbox)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    .page { max-width: 960px; margin: 0 auto; }
    .page h1 { text-align: center; }
    .container { display: flex; gap: 24px; flex-wrap: wrap; }          /* two sides, wraps on small screens */
    .card { flex: 1 1 340px; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { margin-top: 16px; padding: 11px 26px; background: #ea580c; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    .info { background: #1e293b; color: #e2e8f0; }
    .info h2 { margin-top: 0; }
    .item { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; }
    .item .ico { flex: 0 0 36px; height: 36px; border-radius: 50%; background: #ea580c; display: flex; align-items: center; justify-content: center; }
    .map { margin-top: 18px; height: 140px; border-radius: 10px; background: repeating-linear-gradient(45deg,#334155,#334155 10px,#3b4a63 10px,#3b4a63 20px); display: flex; align-items: center; justify-content: center; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Contact Us</h1>
    <div class="container">
      <form class="card" action="#" method="post">
        <h2>Send us a message</h2>
        <label for="n">Your name</label><input type="text" id="n">
        <label for="e">Email</label><input type="email" id="e">
        <label for="m">Message</label><textarea id="m" rows="5"></textarea>
        <button type="submit">Send Message</button>
      </form>

      <aside class="card info">
        <h2>Our Location</h2>
        <div class="item"><span class="ico">&#128205;</span><div>COER University<br>7th KM, Roorkee-Haridwar Road<br>Vardhmanpuram, Roorkee 247 667</div></div>
        <div class="item"><span class="ico">&#128222;</span><div>8070500600<br>9027916050</div></div>
        <div class="item"><span class="ico">&#127760;</span><div>www.coeruniversity.in</div></div>
        <div class="item"><span class="ico">&#128339;</span><div>Mon - Sat: 9:00 AM - 5:00 PM</div></div>
        <div class="map">Map placeholder</div>
      </aside>
    </div>
  </div>
  
</body>
</html>
