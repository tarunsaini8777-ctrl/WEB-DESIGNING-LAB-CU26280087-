<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q14. Design an HTML form with a range slider (type='range') and number input, displaying
     live unit labels.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q14 - Range Slider and Number Input</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    form { max-width: 520px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .group { margin-bottom: 26px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    .live { display: inline-block; min-width: 90px; margin-left: 10px; padding: 3px 10px; background: #dbeafe; color: #1e40af; border-radius: 20px; font-weight: 700; }
    input[type=range] { width: 100%; accent-color: #2563eb; }
    input[type=number] { width: 120px; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    .unit { margin-left: 8px; color: #6b7280; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Order Settings</h1>

    <div class="group">
      <label for="speed">Speed <span class="live" id="speedOut">60 km/h</span></label>
      <input type="range" id="speed" name="speed" min="0" max="120" step="5" value="60">
    </div>

    <div class="group">
      <label for="temp">Temperature <span class="live" id="tempOut">25 &deg;C</span></label>
      <input type="range" id="temp" name="temp" min="-10" max="50" value="25">
    </div>

    <div class="group">
      <label for="weight">Weight</label>
      <input type="number" id="weight" name="weight" min="0" max="100" step="0.5" value="10">
      <span class="unit" id="weightUnit">kg (= 22.05 lb)</span>
    </div>
  </form>
  <script>
    const speed = document.getElementById('speed');
    const temp  = document.getElementById('temp');
    const weight = document.getElementById('weight');

    function update() {
      document.getElementById('speedOut').textContent = speed.value + ' km/h';
      document.getElementById('tempOut').textContent  = temp.value + ' \u00B0C  (' + (temp.value * 9 / 5 + 32).toFixed(1) + ' \u00B0F)';
      document.getElementById('weightUnit').textContent = 'kg (= ' + (weight.value * 2.20462).toFixed(2) + ' lb)';
    }
    [speed, temp, weight].forEach(el => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
