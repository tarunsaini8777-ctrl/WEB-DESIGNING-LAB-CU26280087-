<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q22. Design a newsletter subscription widget with a floating label effect using CSS
     positioning.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q22 - Newsletter with Floating Label</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#0ea5e9,#6366f1); font-family: system-ui, "Segoe UI", sans-serif; padding: 20px; }
    .widget { width: 100%; max-width: 380px; background: #fff; padding: 32px 28px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
    .widget h2 { margin: 0 0 6px; }
    .widget p  { margin: 0 0 22px; color: #6b7280; }

    .float-group { position: relative; margin-bottom: 20px; }            /* positioning context for the label */
    .float-group input { width: 100%; padding: 22px 14px 8px; border: 2px solid #d1d5db; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color .2s; }
    .float-group label {
      position: absolute; left: 14px; top: 17px;                         /* sits inside the input like a placeholder */
      color: #9ca3af; font-size: 1rem; pointer-events: none;
      transform-origin: left top; transition: transform .2s, color .2s;
    }
    /* FLOAT: when focused OR when the input has text (placeholder is not shown) the label moves up and shrinks */
    .float-group input:focus { border-color: #6366f1; }
    .float-group input:focus + label,
    .float-group input:not(:placeholder-shown) + label { transform: translateY(-11px) scale(.75); color: #6366f1; }

    button { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: #6366f1; color: #fff; font-size: 1rem; cursor: pointer; transition: background .2s; }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <form class="widget" action="#" method="post">
    <h2>Stay in the loop</h2>
    <p>Get weekly updates in your inbox.</p>

    <div class="float-group">
      <input type="text" id="nm" name="nm" placeholder=" " required>   <!-- placeholder is a single space (needed for :placeholder-shown) -->
      <label for="nm">Your name</label>
    </div>
    <div class="float-group">
      <input type="email" id="em" name="em" placeholder=" " required>
      <label for="em">Email address</label>
    </div>
    <button type="submit">Subscribe</button>
  </form>
  
</body>
</html>
