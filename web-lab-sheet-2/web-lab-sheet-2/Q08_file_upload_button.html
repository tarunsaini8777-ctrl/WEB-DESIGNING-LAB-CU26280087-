<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q8. Create an HTML form featuring file upload (type='file') and a styled custom submit
     button with CSS transitions on :hover and :active states.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q8 - File Upload and Animated Button</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    form { max-width: 480px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    input[type=file] { width: 100%; padding: 10px; border: 2px dashed #94a3b8; border-radius: 8px; background: #f8fafc; }
    input[type=file]::file-selector-button { margin-right: 12px; padding: 8px 14px; border: 0; border-radius: 6px; background: #475569; color: #fff; cursor: pointer; transition: background .25s; }
    input[type=file]::file-selector-button:hover { background: #334155; }
    .btn { margin-top: 22px; padding: 12px 30px; border: 0; border-radius: 30px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer;
           box-shadow: 0 4px 10px rgba(37,99,235,.35); transition: background .3s, transform .2s, box-shadow .3s; }
    .btn:hover  { background: #1d4ed8; transform: translateY(-3px); box-shadow: 0 10px 18px rgba(37,99,235,.45); }   /* hover */
    .btn:active { background: #1e3a8a; transform: translateY(1px) scale(.97); box-shadow: 0 2px 4px rgba(37,99,235,.4); } /* pressed */
  </style>
</head>
<body>
  <form action="#" method="post" enctype="multipart/form-data">
    <h1>Upload Document</h1>
    <label for="title">Document title</label>
    <input type="text" id="title" name="title" placeholder="e.g. Assignment 1">
    <label for="file">Choose a file</label>
    <input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.png,.jpg">
    <button type="submit" class="btn">Upload</button>
  </form>
  
</body>
</html>
