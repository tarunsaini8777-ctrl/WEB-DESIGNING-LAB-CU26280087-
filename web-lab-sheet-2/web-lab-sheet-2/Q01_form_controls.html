<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q1. Create an HTML form with text input, password, radio buttons, checkboxes, dropdown select, and a textarea, styled entirely with external CSS.
  The page has NO <style> block and NO inline styles: everything comes from Q01_style.css.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 - Form with Basic Controls</title>
  <link rel="stylesheet" href="Q01_style.css">
</head>
<body>
  <form class="form-box" action="#" method="post">
    <h1>Sign-up Form</h1>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password">
    </div>

    <fieldset class="inline">
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="male"> Male</label>
      <label><input type="radio" name="gender" value="female"> Female</label>
      <label><input type="radio" name="gender" value="other"> Other</label>
    </fieldset>

    <fieldset class="inline">
      <legend>Hobbies</legend>
      <label><input type="checkbox" name="hobby" value="reading"> Reading</label>
      <label><input type="checkbox" name="hobby" value="music"> Music</label>
      <label><input type="checkbox" name="hobby" value="sports"> Sports</label>
    </fieldset>

    <div class="field">
      <label for="course">Course</label>
      <select id="course" name="course">
        <option value="">-- Select course --</option>
        <option value="mca">MCA</option>
        <option value="bca">BCA</option>
        <option value="btech">B.Tech</option>
      </select>
    </div>

    <div class="field">
      <label for="about">About you</label>
      <textarea id="about" name="about" rows="4" placeholder="Write something about yourself"></textarea>
    </div>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
