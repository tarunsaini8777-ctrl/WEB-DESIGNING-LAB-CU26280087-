<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Content frame</title>
<style>body{margin:0;padding:20px;font-family:Arial,sans-serif;line-height:1.6}section{min-height:260px;padding:10px 0;border-bottom:1px solid #ddd}</style></head>
<body>
  <section id="home"><h2>Home</h2><p>This is the content frame. Use the navigation frame on the left to move between sections.</p></section>
  <section id="about"><h2>About</h2><p>Frames split the browser window into independent areas, each loading its own HTML document.</p></section>
  <section id="contact"><h2>Contact</h2><p>Email: info@example.com</p></section>
</body></html>
