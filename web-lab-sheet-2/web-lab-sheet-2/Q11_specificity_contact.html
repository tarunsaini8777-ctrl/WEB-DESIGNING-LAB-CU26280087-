<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q11. Write an HTML document utilizing inline, internal, and external CSS stylesheets to style a contact form simultaneously, observing specificity rules.

  SPECIFICITY (low -> high):  element (0,0,1)  <  class (0,1,0)  <  ID (1,0,0)  <  inline style (1,0,0,0)  <  !important
  When specificity is equal, the rule that appears LAST wins (so the internal <style> placed after the <link> beats the external sheet).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q11 - Inline, Internal and External CSS</title>

  <!-- 1. EXTERNAL CSS -->
  <link rel="stylesheet" href="Q11_style.css">

  <!-- 2. INTERNAL CSS (comes after the external sheet) -->
  <style>
    h1 { color: #0f766e; }                    /* internal: h1 colour */
    input, textarea { border-color: green; }  /* same specificity as the external rule, but later -> GREEN overrides BLUE */
    .highlight { border-color: orange; background: #fff7ed; }   /* class (0,1,0) beats the element selectors above */
    #email { border-color: purple; }          /* ID (1,0,0) beats class and element selectors */
    button { background: #0f766e; color: #fff; border: 0; padding: 11px 24px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Contact Us</h1>
    <p class="note">Border colours show which rule wins.</p>

    <label for="name">Name <span class="note">(external blue, overridden by internal element rule: <b>green</b>)</span></label>
    <input type="text" id="name" name="name">

    <label for="phone">Phone <span class="note">(class .highlight: <b>orange</b>)</span></label>
    <input type="tel" id="phone" name="phone" class="highlight">

    <label for="email">Email <span class="note">(ID #email beats the class: <b>purple</b>)</span></label>
    <input type="email" id="email" name="email" class="highlight">

    <label for="subject">Subject <span class="note">(inline style beats ID, class and element: <b>red</b>)</span></label>
    <input type="text" id="subject" name="subject" class="highlight" style="border-color: red;">

    <label for="msg">Message <span class="note">(!important wins over everything, even inline: <b>black</b>)</span></label>
    <textarea id="msg" name="msg" rows="3" style="border-color: red;" class="highlight"></textarea>
    <style>#msg { border-color: black !important; }</style>

    <button type="submit">Send</button>
  </form>
</body>
</html>
