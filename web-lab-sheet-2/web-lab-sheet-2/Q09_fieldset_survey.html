<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q9. Implement a survey form utilizing grouped form controls using <fieldset> and
     <legend> tags, styled with custom padding and margins.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q9 - Survey with fieldset and legend</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    form { max-width: 560px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    fieldset { margin: 0 0 22px; padding: 16px 20px 12px; border: 2px solid #cbd5e1; border-radius: 10px; }
    legend { padding: 0 10px; margin-left: 8px; font-weight: 700; color: #7c3aed; }
    fieldset label { display: block; margin: 8px 0; }
    input[type=text], select { width: 100%; padding: 9px 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 11px 26px; background: #7c3aed; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Student Survey</h1>
    <fieldset>
      <legend>Personal Details</legend>
      <label>Name <input type="text" name="name"></label>
      <label>Year of study
        <select name="year"><option>1st</option><option>2nd</option><option>3rd</option></select>
      </label>
    </fieldset>
    <fieldset>
      <legend>How do you travel to campus?</legend>
      <label><input type="radio" name="travel" value="bus"> College bus</label>
      <label><input type="radio" name="travel" value="bike"> Bike / scooter</label>
      <label><input type="radio" name="travel" value="walk"> Walk</label>
    </fieldset>
    <fieldset>
      <legend>Facilities you use</legend>
      <label><input type="checkbox" name="fac" value="lib"> Library</label>
      <label><input type="checkbox" name="fac" value="lab"> Computer lab</label>
      <label><input type="checkbox" name="fac" value="can"> Canteen</label>
    </fieldset>
    <button type="submit">Submit Survey</button>
  </form>
  
</body>
</html>
