<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q3. Implement a multi-column layout using HTML <frameset> and <frame> tags (Note: legacy support practice), containing a navigation frame, header frame, and content frame.
  NOTE: <frameset>/<frame> are obsolete in HTML5 (legacy practice only). Some browsers may still render them.
  Files: Q03_frameset.html (this page) + Q03_header.html + Q03_nav.html + Q03_content.html  - keep them in the same folder.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q3 - Frameset Layout</title>
</head>
<!-- Two rows: header on top, then a row split into two columns: navigation | content -->
<frameset rows="90,*" frameborder="1" border="2">
  <frame src="Q03_header.html"  name="header"  scrolling="no" noresize>
  <frameset cols="200,*">
    <frame src="Q03_nav.html"     name="nav">
    <frame src="Q03_content.html" name="content">
  </frameset>
  <noframes>
    <body>Your browser does not support frames.</body>
  </noframes>
</frameset>
</html>
