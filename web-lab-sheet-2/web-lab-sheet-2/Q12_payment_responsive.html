<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q12. Create a responsive payment gateway checkout form using CSS media queries to adjust
     input widths on mobile screens.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q12 - Responsive Checkout Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    .checkout { max-width: 560px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    .w-full { width: 100%; }
    .w-half { width: calc(50% - 7px); }        /* desktop: two inputs per row */
    .w-third { width: calc(33.333% - 10px); }
    button { width: 100%; padding: 13px; background: #16a34a; color: #fff; border: 0; border-radius: 8px; font-size: 1.05rem; cursor: pointer; }
    /* MOBILE: every input becomes full width and spacing shrinks */
    @media (max-width: 600px) {
      body { padding: 12px; }
      .checkout { padding: 18px; }
      .w-half, .w-third { width: 100%; }
      input, select { font-size: 16px; }
    }
  </style>
</head>
<body>
  <form class="checkout" action="#" method="post">
    <h1>Secure Checkout</h1>
    <div class="field"><label for="holder">Name on card</label><input class="w-full" type="text" id="holder" placeholder="Full name"></div>
    <div class="field"><label for="card">Card number</label><input class="w-full" type="text" id="card" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456"></div>
    <div class="row">
      <div class="field w-third"><label for="mm">Month</label><input class="w-full" type="text" id="mm" maxlength="2" placeholder="MM"></div>
      <div class="field w-third"><label for="yy">Year</label><input class="w-full" type="text" id="yy" maxlength="2" placeholder="YY"></div>
      <div class="field w-third"><label for="cvv">CVV</label><input class="w-full" type="password" id="cvv" maxlength="4" placeholder="***"></div>
    </div>
    <div class="row">
      <div class="field w-half"><label for="zip">PIN code</label><input class="w-full" type="text" id="zip" placeholder="247667"></div>
      <div class="field w-half"><label for="cur">Currency</label><select class="w-full" id="cur"><option>INR</option><option>USD</option></select></div>
    </div>
    <button type="submit">Pay Now</button>
  </form>
  
</body>
</html>
