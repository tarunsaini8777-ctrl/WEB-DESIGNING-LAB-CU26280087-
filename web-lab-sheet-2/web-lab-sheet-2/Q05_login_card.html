<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q5. Design a user login interface inside a centered card container using CSS box-shadow,
     border-radius, and absolute positioning.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q5 - Login Card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); }
    .card {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);   /* absolute centering */
      width: 340px; padding: 36px 30px; background: #fff; border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0,0,0,.30);
    }
    .card h2 { margin: 0 0 20px; text-align: center; color: #4c1d95; }
    .card label { display: block; font-size: .9rem; font-weight: 600; margin: 12px 0 6px; }
    .card input[type=text], .card input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    .card button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px; background: #6d28d9; color: #fff; font-size: 1rem; cursor: pointer; }
    .card button:hover { background: #5b21b6; }
    .badge { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 48px; height: 48px; border-radius: 50%;
             background: #6d28d9; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 6px 14px rgba(0,0,0,.3); }
  </style>
</head>
<body>
  <form class="card" action="#" method="post">
    <div class="badge" aria-hidden="true">&#128100;</div>   <!-- absolutely positioned on the card edge -->
    <h2>Login</h2>
    <label for="user">Username</label>
    <input type="text" id="user" name="user" placeholder="Enter username">
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" placeholder="Enter password">
    <button type="submit">Sign In</button>
  </form>
  
</body>
</html>
