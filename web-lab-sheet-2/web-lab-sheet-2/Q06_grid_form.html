<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q6. Write a CSS stylesheet utilizing CSS Grid to arrange form elements into a clean two-
     column grid layout.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q6 - Two-column Grid Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    form { max-width: 700px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }     /* two equal columns */
    .full { grid-column: 1 / -1; }                                               /* spans both columns */
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 11px 26px; background: #0f766e; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Application Form</h1>
    <div class="grid">
      <div><label for="fn">First name</label><input id="fn" type="text"></div>
      <div><label for="ln">Last name</label><input id="ln" type="text"></div>
      <div><label for="em">Email</label><input id="em" type="email"></div>
      <div><label for="ph">Phone</label><input id="ph" type="tel"></div>
      <div><label for="ct">City</label><input id="ct" type="text"></div>
      <div><label for="co">Course</label><select id="co"><option>MCA</option><option>BCA</option><option>B.Tech</option></select></div>
      <div class="full"><label for="ad">Address</label><textarea id="ad" rows="3"></textarea></div>
      <div class="full"><button type="submit">Submit</button></div>
    </div>
  </form>
  
</body>
</html>
