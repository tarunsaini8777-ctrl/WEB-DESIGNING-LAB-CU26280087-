<!DOCTYPE html>
<!--
  Lab Sheet 2
     Q21. Create an accessible form where every <input> is explicitly linked to its
     corresponding <label> using the for and id attributes.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q21 - Accessible Form (label for / id)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; color: #1f2937; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; }

    form { max-width: 520px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; cursor: pointer; }
    .choice { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .choice label { margin: 0; font-weight: 400; }
    input[type=text], input[type=email], input[type=password], input[type=date], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #94a3b8; border-radius: 8px; font: inherit; }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
    .hint { font-size: .85rem; color: #4b5563; margin: 4px 0 0; }
    button { margin-top: 20px; padding: 11px 26px; background: #1d4ed8; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Library Membership</h1>
    <!-- Each label's  for="..."  matches the id="..."  of its input: clicking the label focuses the field
         and screen readers announce the label when the field is focused. -->

    <label for="fullname">Full name</label>
    <input type="text" id="fullname" name="fullname" required aria-describedby="nameHint">
    <p class="hint" id="nameHint">As written on your ID card.</p>

    <label for="mail">Email</label>
    <input type="email" id="mail" name="mail" required>

    <label for="pwd">Password</label>
    <input type="password" id="pwd" name="pwd" required minlength="8">

    <label for="dob">Date of birth</label>
    <input type="date" id="dob" name="dob">

    <label for="plan">Membership plan</label>
    <select id="plan" name="plan">
      <option value="basic">Basic</option><option value="premium">Premium</option>
    </select>

    <fieldset style="border:1px solid #94a3b8;border-radius:8px;margin-top:16px;">
      <legend>Notifications</legend>
      <div class="choice"><input type="checkbox" id="n-email" name="notify" value="email"><label for="n-email">Email</label></div>
      <div class="choice"><input type="checkbox" id="n-sms" name="notify" value="sms"><label for="n-sms">SMS</label></div>
    </fieldset>

    <label for="notes">Additional notes</label>
    <textarea id="notes" name="notes" rows="3"></textarea>

    <button type="submit">Join</button>
  </form>
  
</body>
</html>
