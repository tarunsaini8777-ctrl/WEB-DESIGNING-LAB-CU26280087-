<!-- Q5: Build a simple recipe page that utilizes <hr/> to separate different sections and <br/> for line breaks within an address format. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Simple Recipe</title></head>
<body>
    <h1>Tea Recipe</h1>
    <h2>Ingredients</h2>
    <p>Water, milk, tea leaves, sugar.</p>
    <hr>
    <h2>Instructions</h2>
    <p>Boil water and tea leaves.<br>Add milk and sugar.<br>Simmer, then serve.</p>
    <hr>
    <h2>Address</h2>
    <p>Home Kitchen<br>Haridwar<br>Uttarakhand, India</p>
</body>
</html>
