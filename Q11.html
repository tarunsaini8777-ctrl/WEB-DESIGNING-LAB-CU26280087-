<!-- Q11: Write an HTML snippet to insert an image into a webpage using the <img> tag with proper src and alt attributes. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Insert Image</title></head>
<body>
    <h1>My Image</h1>
    <img src="images/flower.jpg" alt="A flower">
</body>
</html>
