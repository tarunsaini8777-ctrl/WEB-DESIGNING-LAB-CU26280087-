<section class="hero page-hero"><div class="container"><p class="eyebrow">Portfolio</p><h1>Contact</h1><p>Tell me about your project.</p></div></section>
<section><div class="container"><form class="form" id="contactForm" novalidate>
 <div class="form-success" role="status">Thanks! Your message has been validated and sent.</div>
 <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"><span class="error"></span></div>
 <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="error"></span></div>
 <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error"></span></div>
 <button class="btn" type="submit">Send Message</button>
</form></div></section>
