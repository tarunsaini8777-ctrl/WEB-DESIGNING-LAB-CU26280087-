<!-- Q10: Create an HTML file containing an ordered list that uses Roman numerals (type="I") and lowercase letters (type="a"). -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Ordered List Types</title></head>
<body>
    <h1>Roman Numerals</h1>
    <ol type="I"><li>Introduction</li><li>HTML</li><li>CSS</li></ol>
    <h2>Lowercase Letters</h2>
    <ol type="a"><li>First step</li><li>Second step</li><li>Third step</li></ol>
</body>
</html>
