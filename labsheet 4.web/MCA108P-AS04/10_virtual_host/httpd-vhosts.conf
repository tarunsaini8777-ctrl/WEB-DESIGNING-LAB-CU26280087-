# XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Also ensure httpd.conf has:  Include conf/extra/httpd-vhosts.conf

<VirtualHost *:80>
    ServerName collegeweb.local
    ServerAlias www.collegeweb.local
    DocumentRoot "C:/xampp/htdocs/MCA108P-AS04"
    ErrorLog "logs/collegeweb-error.log"
    CustomLog "logs/collegeweb-access.log" common

    <Directory "C:/xampp/htdocs/MCA108P-AS04">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
