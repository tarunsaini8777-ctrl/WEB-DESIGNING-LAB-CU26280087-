<!-- Q15: Write code demonstrating how to source images both from a local directory folder and from an external URL source. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Local and External Images</title></head>
<body>
    <h2>Local Image</h2>
    <img src="images/flower.jpg" alt="Local flower image" width="250">
    <h2>External Image</h2>
    <img src="https://placehold.co/250x150" alt="Example image loaded from an external URL">
</body>
</html>
