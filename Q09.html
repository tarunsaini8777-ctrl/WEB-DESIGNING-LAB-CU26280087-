<!-- Q9: Build a multi-level nested list representing a university’s course structure. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>University Course Structure</title></head>
<body>
    <h1>University Course Structure</h1>
    <ul>
        <li>Computer Science
            <ul>
                <li>MCA
                    <ul><li>Semester 1</li><li>Semester 2</li></ul>
                </li>
                <li>BCA
                    <ul><li>Semester 1</li><li>Semester 2</li></ul>
                </li>
            </ul>
        </li>
    </ul>
</body>
</html>
