<!-- Q19: Build a complex data table that uses the rowspan attribute to merge cells vertically across multiple rows. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Rowspan Table</title></head>
<body>
    <table border="1">
        <tr><th>Department</th><th>Student</th><th>Course</th></tr>
        <tr><td rowspan="2">Computer Science</td><td>Tarun</td><td>MCA</td></tr>
        <tr><td>Aman</td><td>BCA</td></tr>
        <tr><td>Commerce</td><td>Riya</td><td>B.Com</td></tr>
    </table>
</body>
</html>
