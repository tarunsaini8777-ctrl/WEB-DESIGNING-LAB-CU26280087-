<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q8. Create an interactive calculator web page using JavaScript event listeners
     (addEventListener) for click events on buttons.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q8 - Calculator</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }
    .calc { max-width: 300px; margin: 14px auto 0; background: #0f172a; padding: 14px; border-radius: 14px; }
    .display { background: #1e293b; color: #f8fafc; text-align: right; padding: 18px 14px; border-radius: 8px; font-size: 2rem; min-height: 70px; overflow-x: auto; margin-bottom: 12px; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .keys .k { margin: 0; padding: 16px 0; font-size: 1.2rem; background: #334155; border-radius: 8px; }
    .keys .k:hover { background: #475569; }
    .keys .op { background: #f59e0b; } .keys .op:hover { background: #d97706; }
    .keys .fn { background: #64748b; }
    .keys .eq { background: #16a34a; } .keys .eq:hover { background: #15803d; }
    .keys .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculator</h1>
    <div class="calc">
      <div class="display" id="display">0</div>
      <div class="keys">
        <button class="k fn" data-action="clear">C</button>
        <button class="k fn" data-action="back">&#9003;</button>
        <button class="k fn" data-action="percent">%</button>
        <button class="k op" data-op="/">&divide;</button>
        <button class="k" data-digit="7">7</button><button class="k" data-digit="8">8</button><button class="k" data-digit="9">9</button>
        <button class="k op" data-op="*">&times;</button>
        <button class="k" data-digit="4">4</button><button class="k" data-digit="5">5</button><button class="k" data-digit="6">6</button>
        <button class="k op" data-op="-">&minus;</button>
        <button class="k" data-digit="1">1</button><button class="k" data-digit="2">2</button><button class="k" data-digit="3">3</button>
        <button class="k op" data-op="+">+</button>
        <button class="k zero" data-digit="0">0</button>
        <button class="k" data-action="dot">.</button>
        <button class="k eq" data-action="equals">=</button>
      </div>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let current = '0';        // number being typed
    let previous = null;      // first operand
    let operator = null;      // + - * /
    let startNew = false;     // next digit starts a new number

    function update() { display.textContent = current; }

    function compute(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? 'Error' : a / b;
      }
    }
    function format(n) { return typeof n === 'number' ? String(parseFloat(n.toPrecision(12))) : n; }

    function equals() {
      if (operator === null || previous === null) return;
      const result = compute(parseFloat(previous), parseFloat(current), operator);
      current = format(result);
      previous = null; operator = null; startNew = true;
    }

    // Attach a click listener to EVERY button
    document.querySelectorAll('.k').forEach(btn => {
      btn.addEventListener('click', () => {
        if (current === 'Error' && !btn.dataset.action) { current = '0'; }

        if (btn.dataset.digit !== undefined) {                  // digits
          current = (current === '0' || startNew) ? btn.dataset.digit : current + btn.dataset.digit;
          startNew = false;
        } else if (btn.dataset.op) {                            // operators
          if (operator !== null && !startNew) equals();         // chain: 2 + 3 + ...
          previous = current; operator = btn.dataset.op; startNew = true;
        } else {
          switch (btn.dataset.action) {
            case 'equals':  equals(); break;
            case 'clear':   current = '0'; previous = null; operator = null; startNew = false; break;
            case 'back':    current = current.length > 1 && current !== 'Error' ? current.slice(0, -1) : '0'; break;
            case 'dot':     if (startNew) { current = '0'; startNew = false; } if (!current.includes('.')) current += '.'; break;
            case 'percent': current = format(parseFloat(current) / 100); break;
          }
        }
        update();
      });
    });
    update();
  </script>
</body>
</html>
