<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q13. Write a JavaScript program implementing closure to maintain a private counter
     variable with increment and decrement methods.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q13 - Closure Counter</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }
    .count { font-size: 3.4rem; text-align: center; font-weight: 700; color: #1d4ed8; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Closure: Private Counter</h1>
    <div class="count" id="value">0</div>
    <button id="inc">+ Increment</button>
    <button id="dec" class="danger">- Decrement</button>
    <button id="reset" class="secondary">Reset</button>
    <div class="out" id="out"></div>
  </div>

  <script>
    function createCounter(start = 0) {
      let count = start;                         // PRIVATE: only the returned functions can reach it (closure)
      return {
        increment() { count++; return count; },
        decrement() { count--; return count; },
        reset()     { count = start; return count; },
        getValue()  { return count; }
      };
    }

    const counter  = createCounter(0);
    const counter2 = createCounter(100);         // a separate counter with its own private variable

    const valueEl = document.getElementById('value');
    const out = document.getElementById('out');
    const refresh = () => { valueEl.textContent = counter.getValue(); };

    document.getElementById('inc').addEventListener('click',   () => { counter.increment(); refresh(); });
    document.getElementById('dec').addEventListener('click',   () => { counter.decrement(); refresh(); });
    document.getElementById('reset').addEventListener('click', () => { counter.reset();     refresh(); });

    counter2.increment();
    out.textContent =
      `counter.count (direct access)  -> ${counter.count}   (undefined: the variable is private)\n` +
      `counter  value                 -> ${counter.getValue()}\n` +
      `counter2 value (starts at 100) -> ${counter2.getValue()}   (independent of counter)`;
    refresh();
  </script>
</body>
</html>
