<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q1. Write a JavaScript program to accept two numbers via prompt dialogs, perform
     arithmetic operations, and display the result using console.log and alert.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 - Prompt Arithmetic</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }

  </style>
</head>
<body>
  <div class="card">
    <h1>Arithmetic with prompt()</h1>
    <p class="hint">Click the button, enter two numbers in the prompt dialogs. Results appear in an alert, in the console (F12) and below.</p>
    <button id="run">Enter two numbers</button>
    <div class="out" id="out">Result will appear here.</div>
  </div>

  <script>
    document.getElementById('run').addEventListener('click', function () {
      // prompt() returns a STRING (or null if Cancel is pressed), so convert with Number()
      const rawA = prompt('Enter the first number:');
      const rawB = prompt('Enter the second number:');

      if (rawA === null || rawB === null || rawA.trim() === '' || rawB.trim() === '') {
        alert('Input cancelled or empty. Please enter two numbers.');
        return;
      }
      const a = Number(rawA);
      const b = Number(rawB);
      if (Number.isNaN(a) || Number.isNaN(b)) {
        alert('Invalid input! Please enter valid numbers.');
        return;
      }

      const result = {
        sum: a + b,
        difference: a - b,
        product: a * b,
        quotient: b === 0 ? 'Cannot divide by zero' : a / b,
        remainder: b === 0 ? 'Cannot divide by zero' : a % b,
        power: a ** b
      };

      const text =
        `Numbers: ${a} and ${b}\n` +
        `Sum        : ${result.sum}\n` +
        `Difference : ${result.difference}\n` +
        `Product    : ${result.product}\n` +
        `Quotient   : ${result.quotient}\n` +
        `Remainder  : ${result.remainder}\n` +
        `Power      : ${a} ^ ${b} = ${result.power}`;

      console.log(text);                       // 1. console.log
      alert(text);                             // 2. alert
      document.getElementById('out').textContent = text;   // 3. also show on the page
    });
  </script>
</body>
</html>
