<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q4. Create a JavaScript loop (for, while, do-while) program to generate and print the
     Fibonacci series up to n terms on the webpage.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q4 - Fibonacci Series</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }

  </style>
</head>
<body>
  <div class="card">
    <h1>Fibonacci Series</h1>
    <label for="n">Number of terms (n)</label>
    <input type="number" id="n" min="1" max="50" value="10">
    <button id="go">Generate</button>
    <div class="out" id="out">Press Generate.</div>
  </div>

  <script>
    function fibFor(n) {                 // for loop
      const s = [];
      let a = 0, b = 1;
      for (let i = 0; i < n; i++) { s.push(a); [a, b] = [b, a + b]; }
      return s;
    }
    function fibWhile(n) {               // while loop
      const s = [];
      let a = 0, b = 1, i = 0;
      while (i < n) { s.push(a); const next = a + b; a = b; b = next; i++; }
      return s;
    }
    function fibDoWhile(n) {             // do-while loop (runs at least once, so n >= 1 is required)
      const s = [];
      let a = 0, b = 1, i = 0;
      do { s.push(a); const next = a + b; a = b; b = next; i++; } while (i < n);
      return s;
    }

    document.getElementById('go').addEventListener('click', () => {
      const n = parseInt(document.getElementById('n').value, 10);
      const out = document.getElementById('out');
      if (!Number.isInteger(n) || n < 1 || n > 50) { out.textContent = 'Enter n between 1 and 50.'; return; }
      out.textContent =
        `for loop      : ${fibFor(n).join(', ')}\n\n` +
        `while loop    : ${fibWhile(n).join(', ')}\n\n` +
        `do-while loop : ${fibDoWhile(n).join(', ')}`;
    });
  </script>
</body>
</html>
