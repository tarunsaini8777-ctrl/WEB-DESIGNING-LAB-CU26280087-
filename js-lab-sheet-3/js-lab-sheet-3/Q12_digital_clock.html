<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q12. Create a digital clock web page using JavaScript setInterval and Date object to
     display live time updating every second.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q12 - Digital Clock</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }
    .clock { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 3.2rem; text-align: center; background: #0f172a; color: #22d3ee; padding: 26px 10px; border-radius: 12px; letter-spacing: 3px; } .date { text-align: center; margin-top: 12px; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Digital Clock</h1>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>
    <button id="toggle" class="secondary">Switch to 12-hour format</button>
  </div>

  <script>
    const clockEl = document.getElementById('clock');
    const dateEl  = document.getElementById('date');
    const toggle  = document.getElementById('toggle');
    let use24 = true;

    const pad = (n) => String(n).padStart(2, '0');

    function tick() {
      const now = new Date();                          // current date and time
      let h = now.getHours();
      const m = now.getMinutes(), s = now.getSeconds();
      let suffix = '';
      if (!use24) { suffix = h >= 12 ? ' PM' : ' AM'; h = h % 12 || 12; }
      clockEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}${suffix}`;
      dateEl.textContent = now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    tick();                              // show the time immediately (do not wait 1 second)
    setInterval(tick, 1000);             // then refresh every 1000 ms

    toggle.addEventListener('click', () => {
      use24 = !use24;
      toggle.textContent = use24 ? 'Switch to 12-hour format' : 'Switch to 24-hour format';
      tick();
    });
  </script>
</body>
</html>
