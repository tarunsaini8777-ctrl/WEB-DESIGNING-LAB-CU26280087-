<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q20. Create a dynamic table generator in JavaScript that takes row and column counts
     from user inputs and renders a populated HTML table.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q20 - Dynamic Table Generator</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }
    .row { display: flex; gap: 14px; } .row > div { flex: 1; } .holder { overflow-x: auto; } .holder table { border-collapse: collapse; width: 100%; } .holder th, .holder td { border: 1px solid #cbd5e1; padding: 7px 10px; text-align: center; } .holder thead th { background: #1d4ed8; color: #fff; } .holder tbody th { background: #dbeafe; } .holder tbody tr:nth-child(even) td { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Table Generator</h1>
    <div class="row">
      <div><label for="rows">Rows (1-20)</label><input type="number" id="rows" min="1" max="20" value="5"></div>
      <div><label for="cols">Columns (1-10)</label><input type="number" id="cols" min="1" max="10" value="4"></div>
    </div>
    <button id="go">Generate table</button>
    <p class="hint" id="msg"></p>
    <div id="holder" class="holder"></div>
  </div>

  <script>
    function generateTable(rows, cols) {
      const table = document.createElement('table');
      const thead = table.createTHead();
      const headRow = thead.insertRow();
      const corner = document.createElement('th'); corner.textContent = '#'; headRow.appendChild(corner);
      for (let c = 1; c <= cols; c++) {
        const th = document.createElement('th'); th.textContent = 'Col ' + c; headRow.appendChild(th);
      }
      const tbody = table.createTBody();
      for (let r = 1; r <= rows; r++) {
        const tr = tbody.insertRow();
        const rh = document.createElement('th'); rh.textContent = 'Row ' + r; tr.appendChild(rh);
        for (let c = 1; c <= cols; c++) {
          const td = tr.insertCell();
          td.textContent = r * c;                         // populate: multiplication table values
        }
      }
      return table;
    }

    document.getElementById('go').addEventListener('click', () => {
      const rows = parseInt(document.getElementById('rows').value, 10);
      const cols = parseInt(document.getElementById('cols').value, 10);
      const msg = document.getElementById('msg');
      const holder = document.getElementById('holder');
      if (!(rows >= 1 && rows <= 20 && cols >= 1 && cols <= 10)) {
        msg.textContent = 'Rows must be 1-20 and columns 1-10.'; msg.className = 'hint bad'; holder.replaceChildren(); return;
      }
      msg.textContent = `Generated a ${rows} x ${cols} table.`; msg.className = 'hint ok';
      holder.replaceChildren(generateTable(rows, cols));   // replace any previous table
    });
    document.getElementById('go').click();
  </script>
</body>
</html>
