<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q6. Implement an array manipulation script in JavaScript that adds, removes, sorts, and
     filters elements using built-in array methods (push, pop, map, filter).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q6 - Array Methods</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }

  </style>
</head>
<body>
  <div class="card">
    <h1>Array Manipulation</h1>
    <p class="hint">Current array: <strong id="arr"></strong></p>
    <label for="val">Number to add</label>
    <input type="number" id="val" placeholder="e.g. 42">
    <button id="push">push (add)</button>
    <button id="pop" class="danger">pop (remove last)</button>
    <button id="sort" class="secondary">sort ascending</button>
    <br>
    <button id="map" class="secondary">map (double all)</button>
    <button id="filter" class="secondary">filter (even only)</button>
    <button id="reset" class="secondary">reset</button>
    <div class="out" id="log">Operations will be logged here.</div>
  </div>

  <script>
    const START = [5, 12, 8, 3, 21, 16];
    let numbers = [...START];

    const arrEl = document.getElementById('arr');
    const logEl = document.getElementById('log');
    const show = (msg) => { arrEl.textContent = '[' + numbers.join(', ') + ']'; if (msg) logEl.textContent = msg; };

    document.getElementById('push').addEventListener('click', () => {
      const v = document.getElementById('val').value;
      if (v === '') { show('Enter a number first.'); return; }
      numbers.push(Number(v));                              // add at the end
      show(`push(${v}) -> added at the end`);
    });
    document.getElementById('pop').addEventListener('click', () => {
      const removed = numbers.pop();                        // remove from the end
      show(removed === undefined ? 'Array is empty.' : `pop() -> removed ${removed}`);
    });
    document.getElementById('sort').addEventListener('click', () => {
      numbers.sort((a, b) => a - b);                        // numeric sort (default sort is alphabetical!)
      show('sort((a, b) => a - b) -> ascending order');
    });
    document.getElementById('map').addEventListener('click', () => {
      numbers = numbers.map(n => n * 2);                    // new array with every element doubled
      show('map(n => n * 2) -> every element doubled');
    });
    document.getElementById('filter').addEventListener('click', () => {
      numbers = numbers.filter(n => n % 2 === 0);           // keep only the even numbers
      show('filter(n => n % 2 === 0) -> only even numbers kept');
    });
    document.getElementById('reset').addEventListener('click', () => { numbers = [...START]; show('Array reset.'); });
    show();
  </script>
</body>
</html>
