<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q2. Implement a JavaScript function that checks whether an input number is prime or
     composite, outputting the result dynamically into a web page div.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q2 - Prime or Composite</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }

  </style>
</head>
<body>
  <div class="card">
    <h1>Prime or Composite?</h1>
    <label for="num">Enter a whole number</label>
    <input type="number" id="num" placeholder="e.g. 29">
    <button id="check">Check</button>
    <div class="out" id="result">The result will appear here.</div>
  </div>

  <script>
    function checkNumber(n) {
      if (!Number.isInteger(n))  return 'Please enter a whole number.';
      if (n < 2)                 return `${n} is neither prime nor composite.`;
      for (let i = 2; i * i <= n; i++) {            // only test divisors up to sqrt(n)
        if (n % i === 0) return `${n} is a COMPOSITE number (divisible by ${i}).`;
      }
      return `${n} is a PRIME number.`;
    }

    const input  = document.getElementById('num');
    const result = document.getElementById('result');

    function run() {
      const value = input.value.trim() === '' ? NaN : Number(input.value);
      result.textContent = checkNumber(value);      // output into the div
    }
    document.getElementById('check').addEventListener('click', run);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  </script>
</body>
</html>
