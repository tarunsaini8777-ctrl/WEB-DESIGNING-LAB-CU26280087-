<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q10. Implement real-time form validation in JavaScript checking if password and confirm
     password fields match before submission.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q10 - Password Validation</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }
    .msg { min-height: 1.4em; margin: 10px 0 0; } button:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <form id="form" novalidate>
      <label for="user">Username</label>
      <input type="text" id="user" placeholder="Choose a username">
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="At least 6 characters">
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" placeholder="Re-type the password">
      <p id="msg" class="msg"></p>
      <button type="submit" id="submit" disabled>Register</button>
    </form>
    <div class="out" id="out" style="display:none"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const pw = document.getElementById('pw');
    const pw2 = document.getElementById('pw2');
    const msg = document.getElementById('msg');
    const submit = document.getElementById('submit');

    function validate() {
      let ok = false;
      if (pw.value.length === 0 && pw2.value.length === 0) {
        msg.textContent = ''; msg.className = 'msg';
      } else if (pw.value.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'msg bad';
      } else if (pw2.value.length === 0) {
        msg.textContent = 'Please confirm the password.'; msg.className = 'msg';
      } else if (pw.value !== pw2.value) {
        msg.textContent = 'Passwords do not match.'; msg.className = 'msg bad';
      } else {
        msg.textContent = 'Passwords match.'; msg.className = 'msg ok'; ok = true;
      }
      pw2.style.borderColor = pw2.value === '' ? '' : (pw.value === pw2.value ? '#16a34a' : '#dc2626');
      submit.disabled = !ok;
      return ok;
    }

    // REAL-TIME: validate on every keystroke
    pw.addEventListener('input', validate);
    pw2.addEventListener('input', validate);

    // Also protect the submit itself
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validate()) return;                       // stop if the passwords differ
      const out = document.getElementById('out');
      out.style.display = 'block';
      out.textContent = 'Form submitted successfully for user: ' + (document.getElementById('user').value || '(none)');
    });
  </script>
</body>
</html>
