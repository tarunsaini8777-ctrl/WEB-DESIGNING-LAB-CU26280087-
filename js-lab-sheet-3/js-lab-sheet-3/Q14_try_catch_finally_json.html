<!DOCTYPE html>
<!--
  Lab Sheet 3
     Q14. Implement exception handling in JavaScript using try...catch...finally blocks while
     parsing a JSON string.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q14 - try...catch...finally with JSON</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #1d4ed8; }
    p.hint { margin: 0 0 16px; color: #6b7280; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { background: #1e40af; }
    button.secondary { background: #64748b; } button.danger { background: #dc2626; }
    .out { margin-top: 18px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 48px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
    .ok { color: #15803d; font-weight: 700; } .bad { color: #b91c1c; font-weight: 700; }

  </style>
</head>
<body>
  <div class="card">
    <h1>Safe JSON Parsing</h1>
    <label for="json">JSON text</label>
    <textarea id="json" rows="5">{"name": "Aman", "age": 22, "skills": ["HTML", "CSS", "JS"]}</textarea>
    <button id="parse">Parse JSON</button>
    <button id="bad" class="secondary">Load invalid JSON</button>
    <div class="out" id="out">Result will appear here.</div>
  </div>

  <script>
    const ta  = document.getElementById('json');
    const out = document.getElementById('out');

    function parseJSONSafely(text) {
      const log = [];
      try {
        log.push('try     : parsing...');
        const data = JSON.parse(text);                 // throws SyntaxError for invalid JSON
        log.push('try     : success!');
        log.push('Result  : ' + JSON.stringify(data, null, 2));
      } catch (error) {
        log.push(`catch   : ${error.name} - ${error.message}`);   // runs only when an error occurs
      } finally {
        log.push('finally : always runs (cleanup / "done" message)');
      }
      return log.join('\n');
    }

    document.getElementById('parse').addEventListener('click', () => { out.textContent = parseJSONSafely(ta.value); });
    document.getElementById('bad').addEventListener('click', () => {
      ta.value = "{name: 'Aman', age: 22,}";            // invalid: unquoted key, single quotes, trailing comma
      out.textContent = parseJSONSafely(ta.value);
    });
  </script>
</body>
</html>
