<!-- Q1: Create a basic HTML5 webpage that includes the <!DOCTYPE html>, <html>, <head>, <title>, and <body> tags along with a heading and a paragraph describing your favorite hobby. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby</title>
</head>
<body>
    <h1>My Favorite Hobby</h1>
    <p>My favorite hobby is reading books because it helps me learn new things.</p>
</body>
</html>
