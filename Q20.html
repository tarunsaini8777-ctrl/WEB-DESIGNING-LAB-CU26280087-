<!-- Q20: Construct a financial report table that correctly structures its content using <thead>, <tbody>, and <tfoot> semantic tags. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Financial Report</title></head>
<body>
    <table border="1">
        <caption>Monthly Financial Report</caption>
        <thead><tr><th>Item</th><th>Amount (INR)</th></tr></thead>
        <tbody>
            <tr><td>Income</td><td>20000</td></tr>
            <tr><td>Expenses</td><td>8000</td></tr>
        </tbody>
        <tfoot><tr><th>Balance</th><th>12000</th></tr></tfoot>
    </table>
</body>
</html>
