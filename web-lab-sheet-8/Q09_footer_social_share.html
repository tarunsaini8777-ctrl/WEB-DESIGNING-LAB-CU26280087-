<!--
  Q9. Add social media integration feeds and sharing buttons within the
  website footer.
  Note: official feed widgets (Instagram, X) need an account/token. Here the
  "feed" is a JavaScript-rendered list of latest posts (replace the array with
  a real API response, or paste the official embed code from the platform).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footer Social Integration | Rye &amp; Rosemary</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #2A2024; }
    main { min-height: 40vh; padding: 2rem; }
    footer { background: #3B2A30; color: #fff; padding: 2rem 1rem; }
    .footer-grid { display: grid; gap: 2rem; max-width: 1100px; margin: 0 auto; }
    footer h2 { font-size: 1.125rem; margin: 0 0 .75rem; font-family: Georgia, serif; }
    footer a { color: #fff; }
    .links, .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    .feed li { background: rgba(255,255,255,.1); padding: .75rem; border-radius: 6px; font-size: .9rem; }
    .feed time { display: block; font-size: .8rem; opacity: .85; }
    .share { display: flex; flex-wrap: wrap; gap: .5rem; }
    .share a, .share button { background: #fff; color: #3B2A30; border: 0; padding: .5rem .9rem; border-radius: 6px; text-decoration: none; font-size: .95rem; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; }
    a:focus-visible, button:focus-visible { outline: 3px solid #E9C98F; outline-offset: 2px; }
    @media (min-width: 768px) { .footer-grid { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <main><h1>Page content</h1><p>Scroll to the footer to see social links, latest posts and share buttons.</p></main>

  <footer>
    <div class="footer-grid">
      <section aria-labelledby="follow">
        <h2 id="follow">Follow us</h2>
        <ul class="links">
          <li><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a></li>
          <li><a href="https://facebook.com/" target="_blank" rel="noopener">Facebook</a></li>
          <li><a href="https://x.com/" target="_blank" rel="noopener">X (Twitter)</a></li>
        </ul>
      </section>

      <section aria-labelledby="latest">
        <h2 id="latest">Latest posts</h2>
        <ul class="feed" id="feed" aria-live="polite"><li>Loading posts…</li></ul>
      </section>

      <section aria-labelledby="share-title">
        <h2 id="share-title">Share this page</h2>
        <div class="share">
          <a id="s-fb" target="_blank" rel="noopener">Facebook</a>
          <a id="s-x"  target="_blank" rel="noopener">X</a>
          <a id="s-wa" target="_blank" rel="noopener">WhatsApp</a>
          <button type="button" id="copy">Copy link</button>
        </div>
        <p id="copy-status" role="status"></p>
      </section>
    </div>
  </footer>

  <script>
    // ----- Social feed (sample data; swap for a real API/embed) -----
    const posts = [
      { text: 'Fresh rye loaves out of the oven at 7 am.', date: '2026-10-28' },
      { text: 'New: pumpkin and walnut loaf this weekend.', date: '2026-10-25' },
      { text: 'Thank you for 500 five-star reviews!', date: '2026-10-20' }
    ];
    const feed = document.getElementById('feed');
    feed.innerHTML = '';
    posts.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.text;                      // textContent avoids HTML injection
      const t = document.createElement('time');
      t.dateTime = p.date; t.textContent = new Date(p.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      li.prepend(t);
      feed.appendChild(li);
    });

    // ----- Share buttons use the current page URL and title -----
    const url = encodeURIComponent(location.href);
    const title = encodeURIComponent(document.title);
    document.getElementById('s-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + url;
    document.getElementById('s-x').href  = 'https://twitter.com/intent/tweet?url=' + url + '&text=' + title;
    document.getElementById('s-wa').href = 'https://wa.me/?text=' + title + '%20' + url;

    document.getElementById('copy').addEventListener('click', async () => {
      const status = document.getElementById('copy-status');
      try { await navigator.clipboard.writeText(location.href); status.textContent = 'Link copied.'; }
      catch { status.textContent = 'Copy failed. Select the address bar and copy manually.'; }
    });
  </script>
</body>
</html>
