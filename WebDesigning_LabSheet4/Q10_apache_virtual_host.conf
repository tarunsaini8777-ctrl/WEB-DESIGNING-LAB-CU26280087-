# Lab Sheet 4 - Question 10: Configure Apache virtual hosts (httpd-vhosts.conf) to host a local development project directory under a custom domain name (e.g., http://collegeweb.local).

# ---- httpd-vhosts.conf ----
# XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Linux: /etc/apache2/sites-available/collegeweb.conf

<VirtualHost *:80>
    ServerName collegeweb.local
    ServerAlias www.collegeweb.local
    DocumentRoot "C:/xampp/htdocs/collegeweb"

    <Directory "C:/xampp/htdocs/collegeweb">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  "logs/collegeweb-error.log"
    CustomLog "logs/collegeweb-access.log" common
</VirtualHost>

# ---- STEPS ----
# 1. In httpd.conf make sure this line is NOT commented:
#      Include conf/extra/httpd-vhosts.conf
# 2. Edit hosts file (run editor as Administrator):
#      Windows: C:\Windows\System32\drivers\etc\hosts
#      Linux  : /etc/hosts
#    Add:
#      127.0.0.1   collegeweb.local
# 3. Create the folder C:/xampp/htdocs/collegeweb and put an index.php in it.
# 4. Restart Apache (Linux: sudo a2ensite collegeweb && sudo systemctl reload apache2)
# 5. Open http://collegeweb.local
