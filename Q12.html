<!-- Q12: Create a webpage featuring an image where you explicitly define the width and height attributes. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Image Dimensions</title></head>
<body>
    <h1>Image with Width and Height</h1>
    <img src="images/flower.jpg" alt="A flower" width="300" height="200">
</body>
</html>
