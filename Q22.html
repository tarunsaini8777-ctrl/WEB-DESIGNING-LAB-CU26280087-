<!-- Q22: Add gender selection using radio buttons and hobby selections using checkboxes to a user profile form. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>User Profile</title></head>
<body>
    <h1>User Profile</h1>
    <form action="#" method="post">
        <p>Gender:</p>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
        <p>Hobbies:</p>
        <label><input type="checkbox" name="hobby" value="reading"> Reading</label>
        <label><input type="checkbox" name="hobby" value="music"> Music</label>
        <label><input type="checkbox" name="hobby" value="sports"> Sports</label><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
