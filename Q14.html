<!-- Q14: Implement an image layout using the <figure> and <figcaption> tags to display a photograph with a descriptive caption. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Figure and Caption</title></head>
<body>
    <figure>
        <img src="images/flower.jpg" alt="A flower in bloom" width="300">
        <figcaption>A beautiful flower in bloom.</figcaption>
    </figure>
</body>
</html>
