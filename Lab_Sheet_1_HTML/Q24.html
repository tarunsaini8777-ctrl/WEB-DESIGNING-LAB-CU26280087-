<!-- Q24: Build a feedback form that includes a multi-line text input area (<textarea>) for comments and a file upload input type (<input type="file">). -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Feedback Form</title></head>
<body>
    <h1>Feedback Form</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea><br><br>
        <label for="attachment">Upload a file:</label>
        <input type="file" id="attachment" name="attachment"><br><br>
        <button type="submit">Send Feedback</button>
    </form>
</body>
</html>
