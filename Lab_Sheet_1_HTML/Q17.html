<!-- Q17: Design a product price list table that includes a proper table <caption> and clear table headers (<th>). -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Product Price List</title></head>
<body>
    <table border="1">
        <caption>Product Price List</caption>
        <tr><th>Product</th><th>Price (INR)</th></tr>
        <tr><td>Notebook</td><td>50</td></tr>
        <tr><td>Pen</td><td>10</td></tr>
    </table>
</body>
</html>
