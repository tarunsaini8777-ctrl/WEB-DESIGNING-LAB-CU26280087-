<!-- Q25: Design a structured survey form that groups related fields using <fieldset> and <legend> tags. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Survey Form</title></head>
<body>
    <h1>Student Survey</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </fieldset>
        <br>
        <fieldset>
            <legend>Course Feedback</legend>
            <p>How do you rate your course?</p>
            <label><input type="radio" name="rating" value="excellent"> Excellent</label>
            <label><input type="radio" name="rating" value="good"> Good</label>
            <label><input type="radio" name="rating" value="average"> Average</label>
        </fieldset>
        <br>
        <button type="submit">Submit Survey</button>
    </form>
</body>
</html>
