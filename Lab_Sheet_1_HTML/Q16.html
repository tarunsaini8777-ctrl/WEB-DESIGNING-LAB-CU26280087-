<!-- Q16: Create an HTML table (<table>) with 3 rows and 3 columns containing student information using <tr>, <th>, and <td> tags. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Student Table</title></head>
<body>
    <table border="1">
        <tr><th>Name</th><th>Roll No.</th><th>Course</th></tr>
        <tr><td>Tarun</td><td>101</td><td>MCA</td></tr>
        <tr><td>Aman</td><td>102</td><td>MCA</td></tr>
    </table>
</body>
</html>
