<!-- Q13: Design a webpage containing an image that, when clicked, redirects the user to an external website using an anchor tag (<a>). -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Clickable Image</title></head>
<body>
    <a href="https://www.wikipedia.org/" target="_blank" rel="noopener noreferrer">
        <img src="images/flower.jpg" alt="Open Wikipedia" width="250">
    </a>
</body>
</html>
