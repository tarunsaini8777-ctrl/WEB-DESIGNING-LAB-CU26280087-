<!-- Q4: Create a webpage using the <blockquote>, <q>, and <cite> tags to display a famous quote and its author. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Famous Quote</title></head>
<body>
    <h1>Famous Quote</h1>
    <blockquote>
        The journey of a thousand miles begins with a single step.
    </blockquote>
    <p>Short quote: <q>Knowledge is power.</q></p>
    <p><cite>Quote commonly attributed to Lao Tzu</cite></p>
</body>
</html>
