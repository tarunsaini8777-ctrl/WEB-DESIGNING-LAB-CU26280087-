<!-- Q2: Write an HTML document demonstrating the use of text formatting tags: bold (<b>/<strong>), italic (<i>/<em>), underline (<u>), and strikethrough (<del>). -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Text Formatting</title></head>
<body>
    <p><b>This text is bold.</b></p>
    <p><strong>This text is important.</strong></p>
    <p><i>This text is italic.</i></p>
    <p><em>This text is emphasized.</em></p>
    <p><u>This text is underlined.</u></p>
    <p><del>This text is deleted or struck through.</del></p>
</body>
</html>
