<!-- Q7: Design a step-by-step instruction guide using an ordered list (<ol>) with numerical markers. -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Step-by-Step Guide</title></head>
<body>
    <h1>How to Create an HTML File</h1>
    <ol>
        <li>Open a text editor.</li>
        <li>Write the HTML code.</li>
        <li>Save the file with the .html extension.</li>
        <li>Open the file in a web browser.</li>
    </ol>
</body>
</html>
